# MediaRush behind nginx  ->  /etc/nginx/sites-available/mediarush   (enable: ln -s ../sites-available/mediarush
# /etc/nginx/sites-enabled/)   then:  sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS:  sudo apt install certbot python3-certbot-nginx
#         sudo certbot --nginx -d iotgateway.live -d www.iotgateway.live --redirect
# (certbot adds the 443 server block and the HTTP -> HTTPS redirect to this file automatically)
#
# Upstreams (started by serve.py / the "mediarush" systemd service):
#   127.0.0.1:8000  cloud (Django: web dashboard + REST API)
#   127.0.0.1:8765  signaling server (WebSockets /ws and /ws/presence, /healthz)
# Port 8766 (TCP reflector for NAT hole punching) is NOT proxied - open it directly in the firewall.

map $http_upgrade $mediarush_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name iotgateway.live www.iotgateway.live;

    client_max_body_size 10m;          # API only - files never go through this server

    # signaling server: WebSockets (connection setup, online status, encrypted chat)
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mediarush_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;       # presence connections stay open
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8765;
    }

    # cloud: web dashboard + REST API
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
